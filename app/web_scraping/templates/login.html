<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Único de Ofertas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b1329;
            --bg-card: #16203a;
            --border-color: #263859;
            --accent-yellow: #ffe600;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top center, #1b284a 0%, #0b1329 80%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
        }

        .brand-title {
            font-weight: 800;
            color: var(--accent-yellow);
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }

        .btn-login {
            background-color: var(--accent-yellow);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            background-color: #e6ce00;
            color: #000000;
            transform: translateY(-2px);
        }

        .form-control:focus {
            background-color: #0d172e;
            border-color: var(--accent-yellow);
            box-shadow: 0 0 0 0.25rem rgba(255, 230, 0, 0.25);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="login-card shadow-lg text-center">
        <div class="mb-3 text-warning">
            <i class="fa-solid fa-shield-halved fa-3x"></i>
        </div>
        <h2 class="brand-title mb-1">Portal Único</h2>
        <p class="text-muted small mb-4">Acesso Restrito ao Painel de Ofertas VPS</p>

        {% if error %}
        <div class="alert alert-danger py-2 small shadow-sm mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="text-start">
            <div class="mb-3">
                <label for="username" class="form-label text-muted small fw-bold">Usuário:</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" name="username" class="form-control bg-dark text-light border-secondary" placeholder="Digite o usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-muted small fw-bold">Senha:</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="Digite a senha" required>
                </div>
            </div>

            <button type="submit" class="btn btn-login w-100 fw-bold">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Entrar no Portal
            </button>
        </form>

        <div class="text-muted small mt-4 pt-3 border-top border-secondary border-opacity-25">
            <i class="fa-solid fa-lock me-1"></i> Autenticação por .env.local
        </div>
    </div>

</body>
</html>
